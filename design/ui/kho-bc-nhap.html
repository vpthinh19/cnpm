<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo nhập kho — Bộ phận Kho (K_BM4)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- K_BM4 — Báo cáo nhập kho (DFD §7.4.4). Chỉ đọc. Lọc tùy chọn theo NCC.
     API: GET /kho/bao-cao/nhap?TuNgay=&DenNgay=&NhaCungCapID= -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="kho-nhap.html">📥 Nhập kho</a>
      <a href="kho-xuat.html">📤 Xuất kho</a>
      <a href="kho-nguyen-lieu.html">🥬 Nguyên liệu</a>
      <a href="kho-ncc.html">🏢 Nhà cung cấp</a>
      <a href="kho-bc-ton.html">📦 Báo cáo tồn</a>
      <a href="kho-bc-nhap.html" class="active">📈 Báo cáo nhập</a>
      <a href="kho-bc-xuat.html">📉 Báo cáo xuất</a>
    </nav>
    <div class="foot">Kho</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Báo cáo nhập kho</div>
      <div class="user"><div class="avatar">D</div><div><div>Phạm Thị D</div><div class="role">Kho</div></div></div>
    </header>

    <div class="content">
      <div class="card"><div class="card-body">
        <div class="toolbar">
          <div class="field"><label>Từ ngày</label><input type="date" id="bn_tu"></div>
          <div class="field"><label>Đến ngày</label><input type="date" id="bn_den"></div>
          <div class="field"><label>Nhà cung cấp</label><select id="bn_ncc"><option value="">Tất cả</option></select></div>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="bn_xem" style="align-self:end">Xem</button>
          <button class="btn" id="bn_print" style="align-self:end">🖨️ In</button>
        </div>
      </div></div>

      <div class="card" id="bn_area">
        <div class="card-head"><h2 id="bn_range">Nhập kho</h2></div>
        <div class="card-body">
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>STT</th><th>Nguyên liệu</th><th>ĐVT</th><th class="num">Tổng SL nhập</th><th class="num">Tổng giá trị</th><th>NCC</th></tr></thead>
            <tbody id="bn_list"></tbody>
            <tfoot><tr><td colspan="4" class="right"><b>Tổng giá trị nhập kỳ</b></td><td class="num money"><b id="bn_tong">0</b></td><td></td></tr></tfoot>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/kho-bc-nhap.js"></script>
</body>
</html>
