<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo tồn kho — Bộ phận Kho (K_BM3)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- K_BM3 — Báo cáo tồn kho (DFD §7.4.2). Chỉ đọc.
     Tồn cuối = Tồn đầu + Nhập − Xuất.
     API: GET /kho/bao-cao/ton?TuNgay=&DenNgay= -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="kho-nhap.html">📥 Nhập kho</a>
      <a href="kho-xuat.html">📤 Xuất kho</a>
      <a href="kho-bc-ton.html" class="active">📦 Báo cáo tồn</a>
      <a href="kho-bc-nhap.html">📈 Báo cáo nhập</a>
      <a href="kho-bc-xuat.html">📉 Báo cáo xuất</a>
    </nav>
    <div class="foot">Kho · ca sáng</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Báo cáo tồn kho</div>
      <div class="user"><div class="avatar">D</div><div><div>Phạm Thị D</div><div class="role">Kho</div></div></div>
    </header>

    <div class="content">
      <div class="card"><div class="card-body">
        <div class="toolbar">
          <div class="field"><label>Từ ngày</label><input type="date" id="bt_tu"></div>
          <div class="field"><label>Đến ngày</label><input type="date" id="bt_den"></div>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="bt_xem" style="align-self:end">Xem báo cáo</button>
          <button class="btn" id="bt_print" style="align-self:end">🖨️ In</button>
        </div>
      </div></div>

      <div class="card">
        <div class="card-head"><h2 id="bt_range">Tồn kho</h2></div>
        <div class="card-body">
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>STT</th><th>Nguyên liệu</th><th>ĐVT</th><th class="num">Tồn đầu</th><th class="num">Nhập</th><th class="num">Xuất</th><th class="num">Tồn cuối</th></tr></thead>
            <tbody id="bt_list"></tbody>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/kho-bc-ton.js"></script>
</body>
</html>
