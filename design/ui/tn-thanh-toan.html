<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán — Thu ngân (TN_BM2)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- TN_BM2 — Xử lý thanh toán (DFD §7.2.1, TN_QĐ1).
     Chỉ thanh toán khi mọi món "Đã phục vụ"/"Đã hủy". VAT lấy từ hằng số (10%).
     API: GET /thanh-toan/xem-truoc/:PhieuOrderID, POST /thanh-toan -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="tn-thanh-toan.html" class="active">💵 Thanh toán</a>
      <a href="tn-hoa-don.html">🧾 Hóa đơn</a>
      <a href="tn-bao-cao-doanh-thu.html">📊 Báo cáo doanh thu</a>
    </nav>
    <div class="foot">Thu ngân · ca chiều</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Thanh toán</div>
      <div class="user"><div class="avatar">C</div><div><div>Lê Văn C</div><div class="role">Thu ngân</div></div></div>
    </header>

    <div class="content">
      <div class="split">

        <!-- Chi tiết món của bàn -->
        <section class="card">
          <div class="card-head"><h2>Order: <select id="tt_order" style="width:auto;display:inline-block"></select></h2><span id="tt_status"></span></div>
          <div class="card-body">
            <div class="table-scroll">
            <table class="tbl">
              <thead><tr><th>Món</th><th class="center">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead>
              <tbody id="tt_lines"></tbody>
            </table>
            </div>
          </div>
        </section>

        <!-- Bảng tính tiền -->
        <section class="card">
          <div class="card-head"><h2>Thông tin thanh toán</h2></div>
          <div class="card-body">
            <div class="r-line" style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Tổng tiền món</span><b class="money" id="tt_tongmon">0</b></div>
            <div class="r-line" style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Thuế VAT (10%)</span><b class="money" id="tt_vat">0</b></div>
            <div class="r-line" style="display:flex;justify-content:space-between;font-size:17px;padding:10px 0;border-top:1px dashed #ccc;border-bottom:1px dashed #ccc;margin-bottom:14px"><span><b>Tổng thanh toán</b></span><b class="money" id="tt_tong">0</b></div>

            <div class="field" style="margin-bottom:12px">
              <label>Hình thức thanh toán</label>
              <div class="radio-row">
                <label><input type="radio" name="httt" value="TienMat" checked> Tiền mặt</label>
                <label><input type="radio" name="httt" value="ChuyenKhoan"> Chuyển khoản</label>
              </div>
            </div>
            <div class="form-grid">
              <div class="field"><label>Tiền khách đưa</label><input type="number" id="tt_khachdua" value=""></div>
              <div class="field"><label>Tiền thừa</label><input type="number" id="tt_thua" value="0" readonly></div>
            </div>
            <div class="field" id="tt_magd_wrap" style="margin-top:12px;display:none"><label>Mã giao dịch (tùy chọn)</label><input type="text" id="tt_magd" placeholder="Mã chuyển khoản..."></div>
            <button class="btn btn-success btn-block btn-lg" id="tt_confirm" style="margin-top:16px">Xác nhận thanh toán</button>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/tn-thanh-toan.js"></script>
</body>
</html>
