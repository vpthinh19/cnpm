<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiếp nhận đặt bàn — Phục vụ (PV_BM1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- PV_BM1 — Tiếp nhận đặt bàn (DFD §7.1.1).
     API: GET /dat-ban, POST /dat-ban, POST /dat-ban/:id/nhan-ban, POST /dat-ban/:id/huy -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="pv-dat-ban.html" class="active">📋 Đặt bàn</a>
      <a href="pv-goi-mon.html">🍜 Gọi món / Order</a>
      <a href="pv-phuc-vu.html">🛎️ Phục vụ ra bàn</a>
      <a href="pv-phieu-bep.html">🧾 Phiếu chuyển bếp</a>
    </nav>
    <div class="foot">Phục vụ</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Tiếp nhận đặt bàn</div>
      <div class="user"><div class="avatar">A</div><div><div>Nguyễn Văn A</div><div class="role">Phục vụ</div></div></div>
    </header>

    <div class="content">
      <div class="split">

        <!-- Form đặt bàn mới -->
        <section class="card">
          <div class="card-head"><h2>Phiếu đặt bàn mới</h2></div>
          <div class="card-body">
            <div class="form-grid">
              <div class="field"><label>Tên khách</label><input type="text" id="db_ten" placeholder="vd: Nguyễn Văn A"></div>
              <div class="field"><label>Số điện thoại</label><input type="tel" id="db_sdt" placeholder="09xx xxx xxx"></div>
              <div class="field"><label>Số người</label><input type="number" id="db_songuoi" min="1" value="4"></div>
              <div class="field"><label>Bàn (đang trống)</label>
                <select id="db_ban"></select>
              </div>
              <div class="field"><label>Thời gian đặt</label><input type="datetime-local" id="db_thoigian"></div>
              <div class="field"><label>Hình thức</label>
                <select id="db_hinhthuc"><option value="QuaDienThoai">Qua điện thoại</option><option value="TrucTiep">Trực tiếp</option></select>
              </div>
              <div class="field full"><label>Ghi chú</label><textarea id="db_ghichu" placeholder="Yêu cầu thêm..."></textarea></div>
            </div>
            <button class="btn btn-primary btn-block" id="db_luu" style="margin-top:16px">Lưu phiếu đặt bàn</button>
          </div>
        </section>

        <!-- Danh sách phiếu đặt -->
        <section class="card">
          <div class="card-head"><h2>Phiếu đặt bàn hôm nay</h2></div>
          <div class="card-body">
            <div class="toolbar"><div class="search"><input type="text" id="db_search" placeholder="Tìm theo SĐT / tên / mã..."></div></div>
            <div class="table-scroll">
            <table class="tbl">
              <thead><tr><th>Mã</th><th>Khách</th><th>Bàn</th><th>Giờ</th><th>Trạng thái</th><th></th></tr></thead>
              <tbody id="db_list"></tbody>
            </table>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/pv-dat-ban.js"></script>
</body>
</html>
