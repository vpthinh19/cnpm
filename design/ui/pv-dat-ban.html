<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiếp nhận đặt bàn — Phục vụ (PV_BM1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- PV_BM1 — Tiếp nhận đặt bàn (DFD §7.1.1).
     API: GET /dat-ban, POST /dat-ban, POST /dat-ban/:id/nhan-ban, POST /dat-ban/:id/huy -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="pv-dat-ban.html" class="active">📋 Đặt bàn</a>
      <a href="pv-goi-mon.html">🍜 Gọi món / Order</a>
      <a href="pv-phuc-vu.html">🛎️ Phục vụ ra bàn</a>
      <a href="pv-phieu-bep.html">🧾 Phiếu chuyển bếp</a>
    </nav>
    <div class="foot">Phục vụ · ca chiều</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Tiếp nhận đặt bàn</div>
      <div class="user"><div class="avatar">A</div><div><div>Nguyễn Văn A</div><div class="role">Phục vụ</div></div></div>
    </header>

    <div class="content">
      <div class="split">

        <!-- Form đặt bàn mới -->
        <section class="card">
          <div class="card-head"><h2>Phiếu đặt bàn mới</h2></div>
          <div class="card-body">
            <div class="form-grid">
              <div class="field"><label>Tên khách</label><input type="text" placeholder="vd: Nguyễn Văn A"></div>
              <div class="field"><label>Số điện thoại</label><input type="tel" placeholder="09xx xxx xxx"></div>
              <div class="field"><label>Số người</label><input type="number" min="1" value="4"></div>
              <div class="field"><label>Bàn</label>
                <select>
                  <option>B01 — Tầng 1 (4 chỗ) · Trống</option>
                  <option>B03 — Tầng 2 (4 chỗ) · Trống</option>
                  <option>SV01 — Sân vườn (8 chỗ) · Trống</option>
                </select>
              </div>
              <div class="field"><label>Thời gian đặt</label><input type="datetime-local"></div>
              <div class="field"><label>Hình thức</label>
                <select><option>Qua điện thoại</option><option>Trực tiếp</option></select>
              </div>
              <div class="field full"><label>Ghi chú</label><textarea placeholder="Yêu cầu thêm..."></textarea></div>
            </div>
            <button class="btn btn-primary btn-block" style="margin-top:16px">Lưu phiếu đặt bàn</button>
          </div>
        </section>

        <!-- Danh sách phiếu đặt -->
        <section class="card">
          <div class="card-head"><h2>Phiếu đặt bàn hôm nay</h2></div>
          <div class="card-body">
            <div class="toolbar"><div class="search"><input type="text" placeholder="Tìm theo SĐT / tên / mã..."></div></div>
            <div class="table-scroll">
            <table class="tbl">
              <thead><tr><th>Mã</th><th>Khách</th><th>Bàn</th><th>Giờ</th><th>Trạng thái</th><th></th></tr></thead>
              <tbody>
                <tr>
                  <td>#15</td><td>Trần B<div class="muted" style="font-size:12px">0903…</div></td><td>B02</td><td>18:30</td>
                  <td><span class="badge blue">Đã đặt</span></td>
                  <td><div class="btn-row"><button class="btn btn-sm btn-success">Nhận bàn</button><button class="btn btn-sm btn-danger">Hủy</button></div></td>
                </tr>
                <tr>
                  <td>#14</td><td>Lê C</td><td>VIP01</td><td>19:00</td>
                  <td><span class="badge green">Đã nhận bàn</span></td>
                  <td class="muted">—</td>
                </tr>
                <tr>
                  <td>#12</td><td>Phạm D</td><td>B04</td><td>12:00</td>
                  <td><span class="badge red">Đã hủy</span></td>
                  <td class="muted">—</td>
                </tr>
              </tbody>
            </table>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>
</body>
</html>
