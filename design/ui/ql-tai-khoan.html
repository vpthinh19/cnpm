<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý tài khoản — Quản lý (QL_BM3)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- QL_BM3 — Quản lý tài khoản (DFD §7.5.3, QL_QĐ1). Thêm/sửa/khóa/mở khóa/đặt lại MK.
     Thực thể hệ thống → API tiếng Anh.
     API: GET/POST /users, PUT /users/:id, PATCH /users/:id/{lock,unlock,reset-password} -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="ql-thuc-don.html">🍽️ Thực đơn</a>
      <a href="ql-ban.html">🪑 Bàn</a>
      <a href="ql-tai-khoan.html" class="active">👤 Tài khoản</a>
      <a href="ql-dashboard.html">📊 Dashboard</a>
    </nav>
    <div class="foot">Quản lý</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Quản lý tài khoản</div>
      <div class="user"><div class="avatar">Q</div><div><div>Quản trị viên</div><div class="role">Quản lý</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head"><h2>Danh sách tài khoản</h2><button class="btn btn-primary btn-sm" id="qa_them">+ Thêm tài khoản</button></div>
        <div class="card-body">
          <div class="toolbar">
            <div class="search"><input type="text" id="qa_search" placeholder="Tìm theo họ tên / tên đăng nhập..."></div>
            <select style="width:auto" id="qa_role"><option value="">Mọi vai trò</option><option value="Admin">Admin</option><option value="PhucVu">Phục vụ</option><option value="Bep">Bếp</option><option value="ThuNgan">Thu ngân</option><option value="Kho">Kho</option></select>
          </div>
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>Mã NV</th><th>Họ tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th class="center">Trạng thái</th><th class="center">Thao tác</th></tr></thead>
            <tbody id="qa_list"></tbody>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/ql-tai-khoan.js"></script>
</body>
</html>
