<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhập kho — Bộ phận Kho (K_BM1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- K_BM1 — Lập phiếu nhập kho (DFD §7.4.1, K_QĐ1).
     Transaction: lưu phiếu + tăng tồn. Tổng = ∑(SL × đơn giá).
     API: GET /kho/nhap, GET /kho/nhap/:id, POST /kho/nhap -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="kho-nhap.html" class="active">📥 Nhập kho</a>
      <a href="kho-xuat.html">📤 Xuất kho</a>
      <a href="kho-bc-ton.html">📦 Báo cáo tồn</a>
      <a href="kho-bc-nhap.html">📈 Báo cáo nhập</a>
      <a href="kho-bc-xuat.html">📉 Báo cáo xuất</a>
    </nav>
    <div class="foot">Kho · ca sáng</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Lập phiếu nhập kho</div>
      <div class="user"><div class="avatar">D</div><div><div>Phạm Thị D</div><div class="role">Kho</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head"><h2>Thông tin phiếu nhập</h2></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field"><label>Nhà cung cấp</label>
              <select id="kn_ncc"></select>
            </div>
            <div class="field"><label>Ngày nhập</label><input type="date" id="kn_ngay"></div>
            <div class="field full"><label>Ghi chú</label><input type="text" id="kn_ghichu" placeholder="..."></div>
          </div>

          <div class="table-scroll" style="margin-top:16px">
          <table class="tbl">
            <thead><tr><th>Nguyên liệu</th><th>ĐVT</th><th class="center">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th><th></th></tr></thead>
            <tbody id="kn_lines"></tbody>
            <tfoot>
              <tr><td colspan="4" class="right"><b>Tổng giá trị nhập</b></td><td class="num money"><b id="kn_total">0</b></td><td></td></tr>
            </tfoot>
          </table>
          </div>

          <div class="btn-row" style="margin-top:14px">
            <button class="btn" id="kn_add">+ Thêm dòng</button>
            <div class="spacer" style="flex:1"></div>
            <button class="btn btn-primary" id="kn_save">Lưu phiếu nhập</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Phiếu nhập gần đây</h2></div>
        <div class="card-body">
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>Số phiếu</th><th>Ngày</th><th>NCC</th><th class="num">Tổng giá trị</th><th></th></tr></thead>
            <tbody id="kn_recent"></tbody>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/kho-nhap.js"></script>
</body>
</html>
