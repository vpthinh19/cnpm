<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xuất kho — Bộ phận Kho (K_BM2)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- K_BM2 — Lập phiếu xuất kho (DFD §7.4.3, K_QĐ1).
     Không xuất quá tồn. Transaction: lưu phiếu + giảm tồn. Cảnh báo tồn ≤ định mức.
     Quán 1 bếp → KHÔNG có "bộ phận nhận".
     API: GET /kho/xuat, GET /kho/xuat/:id, POST /kho/xuat -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="kho-nhap.html">📥 Nhập kho</a>
      <a href="kho-xuat.html" class="active">📤 Xuất kho</a>
      <a href="kho-bc-ton.html">📦 Báo cáo tồn</a>
      <a href="kho-bc-nhap.html">📈 Báo cáo nhập</a>
      <a href="kho-bc-xuat.html">📉 Báo cáo xuất</a>
    </nav>
    <div class="foot">Kho</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Lập phiếu xuất kho</div>
      <div class="user"><div class="avatar">D</div><div><div>Phạm Thị D</div><div class="role">Kho</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head"><h2>Thông tin phiếu xuất</h2></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field"><label>Ngày xuất</label><input type="date" id="kx_ngay"></div>
            <div class="field"><label>Ghi chú</label><input type="text" id="kx_ghichu" placeholder="vd: xuất cho bếp ca sáng"></div>
          </div>

          <div class="table-scroll" style="margin-top:16px">
          <table class="tbl">
            <thead><tr><th>Nguyên liệu</th><th>ĐVT</th><th class="num">Tồn hiện tại</th><th class="center">SL xuất</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th><th></th></tr></thead>
            <tbody id="kx_lines"></tbody>
            <tfoot>
              <tr><td colspan="5" class="right"><b>Tổng giá trị xuất</b></td><td class="num money"><b id="kx_total">0</b></td><td></td></tr>
            </tfoot>
          </table>
          </div>

          <p class="muted" id="kx_canhbao" style="font-size:12.5px;margin:10px 0 0;display:none"></p>

          <div class="btn-row" style="margin-top:14px">
            <button class="btn" id="kx_add">+ Thêm dòng</button>
            <div class="spacer" style="flex:1"></div>
            <button class="btn btn-primary" id="kx_save">Lưu phiếu xuất</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/kho-xuat.js"></script>
</body>
</html>
