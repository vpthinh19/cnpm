<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiếu order bếp — Bộ phận Bếp (B_BM1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- B_BM1 — Nhận / in phiếu order bếp (DFD §7.3.1, tra cứu thuần - không ghi CSDL).
     Danh sách phiếu "Chờ chế biến" theo FIFO; chọn để xem/in.
     API: GET /order/bep/hang-cho (xem), GET /order/:PhieuOrderID (chi tiết để in) -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="bep-kitchen-display.html">🔥 Hàng chờ chế biến</a>
      <a href="bep-phieu-order.html" class="active">🧾 Phiếu order (in)</a>
    </nav>
    <div class="foot">Bếp · ca chiều</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Phiếu order bếp</div>
      <div class="user"><div class="avatar">B</div><div><div>Trần Thị B</div><div class="role">Bếp</div></div></div>
    </header>

    <div class="content">
      <div class="split">
        <!-- Danh sách phiếu chờ (FIFO) -->
        <section class="card">
          <div class="card-head"><h2>Phiếu đang chờ (FIFO)</h2></div>
          <div class="card-body">
            <div class="table-scroll">
            <table class="tbl">
              <thead><tr><th>Bàn</th><th>Order</th><th>Giờ chốt</th><th class="center">SL món</th><th></th></tr></thead>
              <tbody id="po_list"></tbody>
            </table>
            </div>
          </div>
        </section>

        <!-- Xem trước phiếu để in -->
        <section class="card">
          <div class="card-head"><h2>Xem trước phiếu</h2><button class="btn btn-primary btn-sm" id="po_print">🖨️ In phiếu</button></div>
          <div class="card-body">
            <div class="print-stage">
              <div class="receipt">
                <div class="r-center"><h3>PHIẾU ORDER BẾP</h3><div class="r-sub">Bò Né Mỹ Cảnh</div></div>
                <hr>
                <div class="r-line"><span>Bàn:</span><b id="po_ban">—</b></div>
                <div class="r-line"><span>Giờ nhận:</span><span id="po_gio">—</span></div>
                <hr>
                <table>
                  <thead><tr><th>Món</th><th style="text-align:right">SL</th></tr></thead>
                  <tbody id="po_lines"></tbody>
                </table>
                <hr>
                <div class="r-foot">Trạng thái: Chờ chế biến</div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/bep-phieu-order.js"></script>
</body>
</html>
