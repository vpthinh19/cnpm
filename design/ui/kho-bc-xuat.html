<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo xuất kho — Bộ phận Kho (K_BM5)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- K_BM5 — Báo cáo xuất kho (DFD §7.4.5). Chỉ đọc.
     Quán 1 bếp → không còn cột "bộ phận nhận".
     API: GET /kho/bao-cao/xuat?TuNgay=&DenNgay= -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="kho-nhap.html">📥 Nhập kho</a>
      <a href="kho-xuat.html">📤 Xuất kho</a>
      <a href="kho-bc-ton.html">📦 Báo cáo tồn</a>
      <a href="kho-bc-nhap.html">📈 Báo cáo nhập</a>
      <a href="kho-bc-xuat.html" class="active">📉 Báo cáo xuất</a>
    </nav>
    <div class="foot">Kho</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Báo cáo xuất kho</div>
      <div class="user"><div class="avatar">D</div><div><div>Phạm Thị D</div><div class="role">Kho</div></div></div>
    </header>

    <div class="content">
      <div class="card"><div class="card-body">
        <div class="toolbar">
          <div class="field"><label>Từ ngày</label><input type="date" id="bx_tu"></div>
          <div class="field"><label>Đến ngày</label><input type="date" id="bx_den"></div>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="bx_xem" style="align-self:end">Xem</button>
          <button class="btn" id="bx_print" style="align-self:end">🖨️ In</button>
        </div>
      </div></div>

      <div class="card" id="bx_area">
        <div class="card-head"><h2 id="bx_range">Xuất kho</h2></div>
        <div class="card-body">
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>STT</th><th>Nguyên liệu</th><th>ĐVT</th><th class="num">Tổng SL xuất</th><th class="num">Tổng giá trị</th></tr></thead>
            <tbody id="bx_list"></tbody>
            <tfoot><tr><td colspan="4" class="right"><b>Tổng giá trị xuất kỳ</b></td><td class="num money"><b id="bx_tong">0</b></td></tr></tfoot>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/kho-bc-xuat.js"></script>
</body>
</html>
