<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý bàn — Quản lý (QL_BM2)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- QL_BM2 — Quản lý bàn (DFD §7.5.2). Thêm/sửa/xóa bàn; xóa khi bàn "Trống".
     API: GET/POST /ban, PUT /ban/:id, DELETE /ban/:id -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="ql-thuc-don.html">🍽️ Thực đơn</a>
      <a href="ql-ban.html" class="active">🪑 Bàn</a>
      <a href="ql-tai-khoan.html">👤 Tài khoản</a>
      <a href="ql-dashboard.html">📊 Dashboard</a>
    </nav>
    <div class="foot">Quản lý</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Quản lý bàn</div>
      <div class="user"><div class="avatar">Q</div><div><div>Quản trị viên</div><div class="role">Quản lý</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head"><h2>Danh sách bàn</h2><button class="btn btn-primary btn-sm" id="qb_them">+ Thêm bàn</button></div>
        <div class="card-body">
          <div class="toolbar">
            <select style="width:auto" id="qb_trangthai"><option value="">Mọi trạng thái</option><option value="Trong">Trống</option><option value="CoKhach">Có khách</option><option value="DaDat">Đã đặt</option></select>
          </div>
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>Số bàn</th><th>Khu vực</th><th class="center">Sức chứa</th><th class="center">Trạng thái</th><th>Ghi chú</th><th class="center">Thao tác</th></tr></thead>
            <tbody id="qb_list"></tbody>
          </table>
          </div>
          <p class="muted" style="font-size:12.5px;margin:10px 0 0">Chỉ xóa được bàn đang "Trống". Bàn có khách / đã đặt → nút Xóa bị khóa.</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/ql-ban.js"></script>
</body>
</html>
