<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghi nhận gọi món — Phục vụ (PV_BM2)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Màn hình PV_BM2 — Ghi nhận gọi món (DFD §7.1.2) + Chốt order (§7.1.3).
     API: POST /order, POST /order/:PhieuOrderID/dong, PUT/DELETE /order/:PhieuOrderID/dong/:SoDong (ChuaChot), POST /order/:PhieuOrderID/chot -->
<div class="app">

  <!-- Thanh điều hướng vai trò Phục vụ -->
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="pv-dat-ban.html">📋 Đặt bàn</a>
      <a href="pv-goi-mon.html" class="active">🍜 Gọi món / Order</a>
      <a href="pv-phuc-vu.html">🛎️ Phục vụ ra bàn</a>
      <a href="pv-phieu-bep.html">🧾 Phiếu chuyển bếp</a>
    </nav>
    <div class="foot">Phục vụ · ca chiều</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Ghi nhận gọi món</div>
      <div class="user">
        <div class="avatar">A</div>
        <div>
          <div>Nguyễn Văn A</div>
          <div class="role">Phục vụ</div>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="split">

        <!-- CỘT TRÁI: thực đơn để chọn món -->
        <section class="card">
          <div class="card-head">
            <h2>Thực đơn</h2>
          </div>
          <div class="card-body">
            <div class="toolbar">
              <div class="search"><input type="text" id="gm_search" placeholder="Tìm món..."></div>
              <select style="width:auto" id="gm_loai">
                <option value="">Tất cả loại</option>
                <option value="MonAn">Món ăn</option>
                <option value="DoUong">Đồ uống</option>
              </select>
            </div>
            <div class="table-scroll">
            <table class="tbl">
              <thead>
                <tr><th>Tên món</th><th class="center">Loại</th><th class="num">Đơn giá</th><th class="center">Thêm</th></tr>
              </thead>
              <tbody id="gm_menu"></tbody>
            </table>
            </div>
          </div>
        </section>

        <!-- CỘT PHẢI: order hiện tại của bàn -->
        <section class="card">
          <div class="card-head">
            <h2 id="gm_ordertitle">Order</h2>
            <span id="gm_orderbadge"></span>
          </div>
          <div class="card-body">
            <div class="form-grid" style="margin-bottom:14px">
              <div class="field">
                <label>Bàn</label>
                <select id="gm_ban"></select>
              </div>
              <div class="field">
                <label>Mã order</label>
                <input type="text" id="gm_orderma" value="—" readonly>
              </div>
            </div>

            <div class="table-scroll">
            <table class="tbl">
              <thead>
                <tr><th>Món</th><th class="center">SL</th><th class="num">Thành tiền</th><th class="center">TT</th><th></th></tr>
              </thead>
              <tbody id="gm_order"></tbody>
              <tfoot>
                <tr>
                  <td colspan="2" class="right"><b>Tổng tạm tính</b></td>
                  <td class="num money"><b id="gm_total">0</b></td>
                  <td colspan="2"></td>
                </tr>
              </tfoot>
            </table>
            </div>

            <button class="btn btn-primary btn-block" id="gm_chot" style="margin-top:16px">Chốt order → Bếp</button>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/pv-goi-mon.js"></script>
</body>
</html>
