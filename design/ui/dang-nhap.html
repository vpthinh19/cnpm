<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Bò Né Mỹ Cảnh (SYS_BM1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Màn hình SYS_BM1 — Đăng nhập (DFD §7.6.1). API: POST /auth/login -->
  <div class="login-wrap">
    <div class="login-card">
      <div class="head">
        <div class="logo">🥩</div>
        <h1>Bò Né Mỹ Cảnh</h1>
        <p>Hệ thống quản lý nhà hàng</p>
      </div>
      <form class="body" id="loginForm">
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" placeholder="Tên đăng nhập" value="" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu" value="" autocomplete="current-password">
        </div>
        <div id="loginError" class="note" style="color:#dc2626;display:none"></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Đăng nhập</button>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/dang-nhap.js"></script>
</body>
</html>
