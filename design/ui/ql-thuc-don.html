<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý thực đơn — Quản lý (QL_BM1)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- QL_BM1 — Quản lý thực đơn (DFD §7.5.1). Thêm/sửa/xóa món, đổi trạng thái, đơn giá.
     API: GET/POST /mon-an, PUT /mon-an/:id, PATCH /mon-an/:id/trang-thai, DELETE /mon-an/:id -->
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🥩</span> Bò Né Mỹ Cảnh</div>
    <nav>
      <a href="ql-thuc-don.html" class="active">🍽️ Thực đơn</a>
      <a href="ql-ban.html">🪑 Bàn</a>
      <a href="ql-tai-khoan.html">👤 Tài khoản</a>
      <a href="ql-dashboard.html">📊 Dashboard</a>
    </nav>
    <div class="foot">Quản lý</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">Quản lý thực đơn</div>
      <div class="user"><div class="avatar">Q</div><div><div>Quản trị viên</div><div class="role">Quản lý</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head"><h2>Danh sách món</h2><button class="btn btn-primary btn-sm" id="qm_them">+ Thêm món</button></div>
        <div class="card-body">
          <div class="toolbar">
            <div class="search"><input type="text" id="qm_search" placeholder="Tìm theo tên / mã SP..."></div>
            <select style="width:auto" id="qm_loai"><option value="">Tất cả loại</option><option value="MonAn">Món ăn</option><option value="DoUong">Đồ uống</option></select>
            <select style="width:auto" id="qm_trangthai"><option value="">Mọi trạng thái</option><option value="ConHang">Còn hàng</option><option value="HetHang">Hết hàng</option></select>
          </div>
          <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>Mã SP</th><th>Tên món</th><th>Loại</th><th class="num">Đơn giá</th><th class="center">Trạng thái</th><th class="center">Thao tác</th></tr></thead>
            <tbody id="qm_list"></tbody>
          </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/ql-thuc-don.js"></script>
</body>
</html>
